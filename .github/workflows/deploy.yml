name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 見出しを取り込み直すために、定期的に公開し直す（UTC。3時間ごと）
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は一度に一つ。走っている途中のものは止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ニュースの見出しはここで取る。ブラウザからは CORS で読めないため、
      # 取得はサーバー側で済ませ、public/news.json として一緒に配信する。
      # 取得に失敗しても空のファイルを書いて続行する（貼り付け欄は使えるため）。
      - run: node scripts/fetch-news.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Pages がまだ有効でなければ、この場で有効にする
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
